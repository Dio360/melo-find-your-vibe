# MELO local infrastructure (Phase 2)
# Usage: docker compose up -d
# Postgres 16 + Redis 7, matching the implementation plan.
services:
  postgres:
    image: postgres:16
    container_name: melo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: melo
      POSTGRES_PASSWORD: melo
      POSTGRES_DB: melo
    ports:
      - "5432:5432"
    volumes:
      - melo-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: melo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Local S3-compatible object storage for Phase 3 audio delivery.
  # Ephemeral by design — re-run server/prisma/demo-audio.mjs after restart.
  s3:
    image: motoserver/moto:latest
    container_name: melo-s3
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: -p5000 -H0.0.0.0

volumes:
  # Pre-existing local volume (created outside compose) — kept external so
  # `docker compose up/down` never wipes the seeded dev catalogue.
  melo-pgdata:
    name: melo-pgdata
    external: true
