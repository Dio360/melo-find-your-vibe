# MELO local infrastructure (Phase 2)
# Usage: docker compose up -d
# Postgres 16 + Redis 7, matching the implementation plan.
services:
  postgres:
    image: postgres:16
    container_name: melo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: melo
      POSTGRES_PASSWORD: melo
      POSTGRES_DB: melo
    ports:
      - "5432:5432"
    volumes:
      - melo-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: melo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  melo-pgdata:
