# MELO — Render Blueprint (free tier first)
#
# One-click deploy: Render dashboard → New → Blueprint → connect this GitHub
# repo (Dio360/melo-find-your-vibe) → Apply. Render reads this file and
# provisions everything below.
#
# Post-deploy (one time, ~10 min): see docs/melo_deployment.md § Render
#   1. Fill the sync:false env vars when prompted (GROQ, Termii, Resend, R2…).
#   2. Seed the catalogue: Render dashboard → melo-api → Shell →
#        node prisma/seed.mjs
#   3. Then run the smoke checks in docs/melo_launch_checklist.md § 8.
#
# Free-tier notes:
#   - Free web services sleep after ~15 min idle; first request takes ~50 s.
#   - Free Postgres (melo-db) EXPIRES ~30 days after creation — migrate to
#     Neon free (no expiry) before then; steps in melo_deployment.md.

services:
  # ---- NestJS API (Docker; runs `prisma migrate deploy` then serves) ----
  - type: web
    name: melo-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: melo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: melo-kv
          property: connectionString
      # Generated once and kept stable across Blueprint syncs.
      - key: JWT_SECRET
        generateValue: true
      # The API refuses to boot in production without this allowlist.
      # Service URLs are deterministic from the names below.
      - key: CORS_ORIGINS
        value: https://melo-web.onrender.com
      # AI search parsing — fails closed to the rule parser when the key is
      # absent, so the app still works before the Groq key is pasted.
      - key: AI_PARSER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      # OTP delivery — 503 (naming the missing key) until these are filled.
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_SENDER_ID
        value: MELO
      - key: RESEND_API_KEY
        sync: false
      # Default is Resend's sandbox sender; swap after domain verification.
      - key: EMAIL_FROM
        value: MELO <onboarding@resend.dev>
      # Cloudflare R2 (S3-compatible) — free tier, zero egress fees.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      # Monitoring — inert when empty; paste to enable.
      - key: SENTRY_DSN
        sync: false

  # ---- Next.js web app (PWA; serves manifest + service worker) ----
  - type: web
    name: melo-web
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      # NEXT_PUBLIC_* vars are inlined at build time — must match melo-api's
      # onrender.com URL (deterministic from the service name above).
      - key: NEXT_PUBLIC_API_URL
        value: https://melo-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_LOGROCKET_APP_ID
        sync: false

  # ---- Redis-compatible KV: OTP codes + caching (ephemeral by design) ----
  - type: keyvalue
    name: melo-kv
    plan: free
    ipAllowList: []

databases:
  # ⚠️ Free Postgres expires ~30 days after creation (14-day grace).
  # Migrate to Neon free before then — docs/melo_deployment.md.
  - name: melo-db
    plan: free
    databaseName: melo
    user: melo
    ipAllowList: []
