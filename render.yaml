# MELO — Render reference config (free tier first)
#
# ⚠️ These services are ALREADY LIVE in the "My Workspace" Render account
# (provisioned via the Render REST API on 2026-10-11 — the Blueprints API
# is early-access gated). Do NOT apply this file as a Blueprint to that
# workspace: the names collide with the live services. IDs and URLs:
#   melo-api  srv-db5vtc5ckfvc73bkq0fg  https://melo-api-72jn.onrender.com
#   melo-web  srv-db5vrrks728c7397or4g  https://melo-web-dbze.onrender.com
#   melo-kv   red-db5vmf4s728c7397719g  redis://red-db5vmf4s728c7397719g:6379
#   melo-db   dpg-db5vn6vavr4c73a8cskg-a  (free, EXPIRES 2026-11-10)
# Render appends a random suffix to new service names — the bare
# melo-api/melo-web onrender.com names below no longer exist. This file stays
# the env-var inventory source of truth and a working blueprint for a FRESH
# workspace (update the two URL literals below to whatever suffixes Render
# assigns there).
#
# Post-deploy (one time, ~10 min): see docs/melo_deployment.md §2
#   1. Fill the sync:false env vars when prompted (GROQ, Termii, Resend, R2…).
#   2. Seed the catalogue: Render dashboard → melo-api → Shell →
#        node prisma/seed.mjs
#   3. Then run the smoke checks in docs/melo_launch_checklist.md § 8.
#
# Free-tier notes:
#   - Free web services sleep after ~15 min idle; first request takes ~50 s.
#   - Postgres: LIVE DB IS NOW NEON FREE (project melo-db / snowy-credit-62106713,
#     branch production, no expiry) — migrated 2026-10-12, full pg_dump copy.
#     The Render database below is retired; it expired/expired-on 2026-11-10.
#     DATABASE_URL on the live melo-api points at the Neon direct endpoint.

services:
  # ---- NestJS API (Docker; runs `prisma migrate deploy` then serves) ----
  - type: web
    name: melo-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # Reference only: the live service's DATABASE_URL was first filled from
      # this Render database, then migrated to Neon free (2026-10-12) — see
      # the free-tier notes at the top. A fresh workspace would re-provision
      # below and `sync` this key as before.
      - key: DATABASE_URL
        fromDatabase:
          name: melo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: melo-kv
          property: connectionString
      # Generated once and kept stable across Blueprint syncs.
      - key: JWT_SECRET
        generateValue: true
      # The API refuses to boot in production without this allowlist.
      # Live value = the deployed web service's (suffixed) URL.
      - key: CORS_ORIGINS
        value: https://melo-web-dbze.onrender.com
      # AI search parsing — fails closed to the rule parser when the key is
      # absent, so the app still works before the Groq key is pasted.
      - key: AI_PARSER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      # OTP delivery — 503 (naming the missing key) until these are filled.
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_SENDER_ID
        value: MELO
      - key: RESEND_API_KEY
        sync: false
      # Default is Resend's sandbox sender; swap after domain verification.
      - key: EMAIL_FROM
        value: MELO <onboarding@resend.dev>
      # Cloudflare R2 (S3-compatible) — free tier, zero egress fees.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      # Monitoring — inert when empty; paste to enable.
      - key: SENTRY_DSN
        sync: false

  # ---- Next.js web app (PWA; serves manifest + service worker) ----
  - type: web
    name: melo-web
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      # NEXT_PUBLIC_* vars are inlined at build time — must match the live
      # melo-api URL (Render appends a random suffix to service names).
      - key: NEXT_PUBLIC_API_URL
        value: https://melo-api-72jn.onrender.com/api/v1
      - key: NEXT_PUBLIC_LOGROCKET_APP_ID
        sync: false

  # ---- Redis-compatible KV: OTP codes + caching (ephemeral by design) ----
  - type: keyvalue
    name: melo-kv
    plan: free
    ipAllowList: []

databases:
  # RETIRED (2026-10-12): live DATABASE_URL now points at Neon free
  # (project melo-db / snowy-credit-62106713). This Render free DB would
  # have expired 2026-11-10; safe to remove from a fresh workspace.
  - name: melo-db
    plan: free
    databaseName: melo
    user: melo
    ipAllowList: []
